[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# The default `python -m pytest` invocation (used by CI build/release and by
# `make test`) runs ONLY the fast tier: pure-Python / mocked / offline tests.
# The heavy tiers are deselected here by default so a bare run can never again
# download gigabytes of gated checkpoints, run real training/discovery loops,
# or hang for hours on a stalled HF request. To run them explicitly:
#     pytest -m slow          # heavy real-model / training / discovery tests
#     pytest -m gated         # gated checkpoints (needs HF_TOKEN + opt-in env)
#     pytest -m ""            # everything (no marker filter)
# See CONTRIBUTING.md ("Test tiers").
addopts =
    --strict-markers
    --strict-config
    -m "not slow and not gated and not network"
    --tb=short
    -ra

markers =
    slow: heavy tests — real model loads, training loops, discovery/transfer runs (deselect with '-m "not slow"'; run with '-m slow')
    network: needs network access (downloads a real HF model or dataset); deselected by default
    gated: needs a gated HF checkpoint + HF_TOKEN and an explicit opt-in env var
    training: runs a real optimization / fine-tuning loop
    integration: end-to-end / cross-component integration test
    unit: fast, isolated unit test
