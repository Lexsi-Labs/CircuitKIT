version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      pip-updates:
        patterns: ["*"]
    # torch/torchvision are pinned as a CUDA pair (+cu126) in the gpu-cu126 extra;
    # Dependabot drops the local label, so the pair is bumped by hand.
    ignore:
      - dependency-name: "torch"
      - dependency-name: "torchvision"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-updates:
        patterns: ["*"]
    # Major action upgrades change inputs (e.g. slack v1 -> v4); review those by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
